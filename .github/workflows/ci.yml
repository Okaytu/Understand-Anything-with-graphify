name: CI

# Runs both imported projects' test suites from the repository root.
# The projects' own workflows (understand-anything/.github, graphify/.github)
# are kept for reference only — GitHub runs workflows from the root alone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  understand-anything:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: understand-anything
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: understand-anything/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: understand-anything/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @understand-anything/core build

      - name: Build skill
        run: pnpm --filter @understand-anything/skill build

      - name: Test
        run: pnpm test

  graphify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphify
    steps:
      - uses: actions/checkout@v6
        with:
          # graphify's skillgen tests read baseline skill files from older commits
          # with `git show <sha>:<path>`; a shallow checkout lacks them. graphify's
          # own CI uses full history for the same reason.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Test
        run: uv run --frozen pytest tests/ -q --tb=short

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: understand-anything/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: understand-anything/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Build Understand-Anything core (for the schema validator)
        working-directory: understand-anything
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @understand-anything/core build

      - name: Install graphify
        working-directory: graphify
        run: uv sync --frozen

      # Run from inside graphify/: at the repo root the graphify/ folder would
      # shadow the installed package.
      - name: Test bridge + learn-from-zero (unit + end-to-end)
        working-directory: graphify
        run: uv run --frozen pytest ../bridge/tests ../learn-from-zero/tests -q --tb=short
