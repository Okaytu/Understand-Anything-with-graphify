name: CI

# Runs both imported projects' test suites from the repository root.
# The projects' own workflows (understand-anything/.github, graphify/.github)
# are kept for reference only — GitHub runs workflows from the root alone.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  understand-anything:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: understand-anything
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: understand-anything/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: understand-anything/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @understand-anything/core build

      - name: Build skill
        run: pnpm --filter @understand-anything/skill build

      - name: Test
        run: pnpm test

  graphify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphify
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Test
        run: uv run --frozen pytest tests/ -q --tb=short
